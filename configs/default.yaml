paths:
  raw_data: data/raw/telco_customer_churn.csv
  processed_dir: data/processed
  reports_dir: reports
  models_dir: reports/models
  figures_dir: reports/figures

data:
  target_column: Churn
  id_column: customerID
  test_size: 0.2
  random_seed: 42

model:
  # Final selected model name: logistic_regression | hist_gradient_boosting
  selected: logistic_regression
  threshold: 0.5
  logistic_regression:
    max_iter: 1000
    class_weight: balanced
    C: 1.0
  hist_gradient_boosting:
    max_iter: 100
    learning_rate: 0.1
    max_depth: 6
    random_state: 42

business:
  false_positive_cost: 50.0   # cost of unnecessary retention offer
  false_negative_cost: 500.0  # cost of losing a customer without intervention
  retention_value: 200.0      # net value when a true churner is retained

thresholds:
  min: 0.05
  max: 0.95
  step: 0.05
